apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-client
  namespace: shopsphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopsphere-client
  template:
    metadata:
      labels:
        app: shopsphere-client
    spec:
      containers:
        - name: shopsphere-client
          image: 690640933457.dkr.ecr.eu-north-1.amazonaws.com/shopsphere/client:latest
          ports:
            - containerPort: 80
          