name: CI-CD - Build, Push to ECR, Deploy to EKS

on:
  push:
    branches:
      - main
      - FeatureBranch
  pull_request:
    branches:
      - main
      - FeatureBranch
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 690640933457.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY_API: shopsphere/api
  ECR_REPOSITORY_CLIENT: shopsphere/client
  EKS_CLUSTER_NAME: shopsphere-eks
  K8S_NAMESPACE: shopsphere
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.set-output.outputs.image_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG -f ShopSphere.API/Dockerfile .

      - name: Push API image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_API:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:latest

      - name: Build Client image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG -f ShopSphere.Client/Dockerfile ShopSphere.Client

      - name: Push Client image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:latest

      - name: Set output image tag
        id: set-output
        run: echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - name: Verify cluster access
        run: |
          kubectl get nodes

      - name: Ensure namespace exists
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Deploy Mongo resources
        run: |
          kubectl apply -f k8s/mongo-deployment.yaml
          kubectl apply -f k8s/mongo-service.yaml

      - name: Deploy base API and Client resources
        run: |
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/client-deployment.yaml
          kubectl apply -f k8s/client-service.yaml

      - name: Update API image in Kubernetes
        run: |
          kubectl set image deployment/shopsphere-api \
            shopsphere-api=$ECR_REGISTRY/$ECR_REPOSITORY_API:${{ needs.build-and-push.outputs.image_tag }} \
            -n $K8S_NAMESPACE

      - name: Update Client image in Kubernetes
        run: |
          kubectl set image deployment/shopsphere-client \
            shopsphere-client=$ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:${{ needs.build-and-push.outputs.image_tag }} \
            -n $K8S_NAMESPACE

      - name: Wait for API rollout
        run: |
          kubectl rollout status deployment/shopsphere-api -n $K8S_NAMESPACE --timeout=180s

      - name: Wait for Client rollout
        run: |
          kubectl rollout status deployment/shopsphere-client -n $K8S_NAMESPACE --timeout=180s

      - name: Show running services
        run: |
          kubectl get pods -n $K8S_NAMESPACE
          kubectl get svc -n $K8S_NAMESPACE