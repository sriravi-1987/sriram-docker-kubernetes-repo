<section class="product-list">
  <div *ngIf="isLoading" class="state-card">
    Loading products...
  </div>

  <div *ngIf="!isLoading && errorMessage" class="state-card state-card--error">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && !errorMessage && products.length === 0" class="state-card state-card--empty">
    <h3>No products found</h3>
    <p>Your catalog is empty right now. Add your first product to get started.</p>
  </div>

  <div *ngIf="!isLoading && !errorMessage && products.length > 0" class="product-grid">
    <app-product-card
      *ngFor="let product of products"
      [product]="product"
      (delete)="deleteProduct($event)">
    </app-product-card>
  </div>
</section>
