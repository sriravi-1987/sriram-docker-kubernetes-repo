<section class="edit-product-page page-section">
  <a routerLink="/products" class="page-link">← Back to Products</a>

  <div *ngIf="isLoading" class="page-info">
    Loading product details...
  </div>

  <div *ngIf="!isLoading && errorMessage" class="page-error">
    {{ errorMessage }}
  </div>

  <app-product-form
    *ngIf="!isLoading && product"
    mode="edit"
    [product]="product"
    [isSubmitting]="isSubmitting"
    (formSubmitted)="onUpdateProduct($event)">
  </app-product-form>
</section>
